name: CI

# Corre typecheck + tests en cada push a una rama de larga duración y en cada PR.
# El loop de tests también se cierra en local (ver CLAUDE.md); esto es la red de
# seguridad, no el único sitio donde se verifica.
on:
  push:
    branches: [main, develop, maintenance]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build
